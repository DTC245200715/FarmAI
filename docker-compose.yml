version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql_db:
    image: mysql:8.0
    container_name: farmpro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: farmpro_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Python Flask Multi-Agent Backend (Cố vấn Dược phẩm & Chẩn đoán RAG)
  multi_agent_backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.flask
    container_name: farmpro_multi_agent
    restart: always
    environment:
      - PORT=5050
      - DB_HOST=mysql_db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=farmpro_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "5050:5050"
    depends_on:
      mysql_db:
        condition: service_healthy

  # 3. Web App Fullstack (Node Server + React Frontend + SDLC Factory)
  web_app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: farmpro_web_app
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=mysql_db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=farmpro_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - multi_agent_backend

volumes:
  mysql_data:

